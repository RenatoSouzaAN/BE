name: ai-version

services:
  api:
    build: .
    ports: ["8050:8000"]
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://postgres:dev@db:5432/tasks
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  db:
    image: postgres
    container_name: ai-version
    environment:
      - POSTGRES_PASSWORD=dev
      - POSTGRES_DB=tasks
    volumes:
      - ai-version:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tasks"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5440:5432"

volumes:
  ai-version:
    name: ai-version
